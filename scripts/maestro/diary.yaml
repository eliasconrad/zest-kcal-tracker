appId: io.appllama.zestkcaltracker
name: Sample meal, protein answer and calendar
---
- launchApp:
    clearState: true
# A clean install starts with onboarding; the showcase link skips it.
- assertVisible: "What should I call you?"
- assertNotVisible: "Back to chat collection"
- openLink: "zest-kcal-tracker://?demo=1"
# The deep-link confirmation is localized; match English and German.
- tapOn:
    text: "Open|Öffnen"
    optional: true
- assertVisible: "(Good|Still up).*,.*"
- tapOn: "Log a meal"
- tapOn: "Try a sample meal"
- extendedWaitUntil:
    visible: "Take dinner photo"
    timeout: 10000
# The meal is picked under the viewfinder; the shutter names it.
- tapOn: "Lunch"
- assertVisible: "Take lunch photo"
- tapOn: "Dinner"
- tapOn: "Take dinner photo"
- tapOn: "Retake meal photo"
- tapOn: "Take dinner photo"
- tapOn: "Use meal photo"
- extendedWaitUntil:
    visible: "Edit Pasta & garlic bread, 1120 estimated kilocalories"
    timeout: 10000
# The composer and its send button are hosted controls whose AX frames can lag
# a dock animation; tap them by position (composer centre, send at the right).
- tapOn:
    point: "50%, 87%"
- extendedWaitUntil:
    visible: "Message Zest.*"
    timeout: 3000
- inputText: "how much protein"
- tapOn:
    point: "89%, 93%"
- extendedWaitUntil:
    visible: "70 g protein.*"
    timeout: 10000
- tapOn: "Open food diary"
- assertVisible: "2240 kilocalories logged"
- tapOn: "Previous month"
- tapOn: "Next month"
# Hosted SwiftUI controls may retain their pre-animation AX frame on iOS 27.
# The verified close target is at the top trailing corner on iPhone 17 Pro.
- tapOn:
    point: "90%, 10%"
- tapOn: "New Zest conversation"
- assertVisible: "Log a meal"
- tapOn: "Open food diary"
- assertVisible: "2240 kilocalories logged"
# Hosted SwiftUI controls may retain their pre-animation AX frame on iOS 27.
# The verified close target is at the top trailing corner on iPhone 17 Pro.
- tapOn:
    point: "90%, 10%"
