appId: io.appllama.zestkcaltracker
name: Hold the companion, slide along the glass bar, let go on another helper
---
- launchApp:
    clearState: true
- assertVisible: "What should I call you?"
- openLink: "zest-kcal-tracker://?demo=1"
- tapOn:
    text: "Open|Öffnen"
    optional: true
- assertVisible: "(Good|Still up).*,.*"
# The companion stands in the middle of the empty page. XCTest's drag holds at
# the start point until the hold completes (the 380 ms long press with 60 pt
# of slack), then moves quickly and lets go a little early. Mochi's slot is
# the third of six (x 147-201 pt, centre 174 pt = 43 %); the swipe aims at its
# centre and the flow asserts that Mochi, and no other helper, was chosen.
- assertVisible: "Pebble, open calorie calendar"
- swipe:
    start: "50%, 31%"
    end: "43%, 77%"
    duration: 4000
- extendedWaitUntil:
    visible: "Mochi, open calorie calendar"
    timeout: 3000
- assertNotVisible: "Pebble, open calorie calendar"
- takeScreenshot: helpers-swapped
