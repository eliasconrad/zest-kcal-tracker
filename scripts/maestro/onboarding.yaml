appId: io.appllama.zestkcaltracker
name: First launch onboarding, computed guide and profile sheet
---
- launchApp:
    clearState: true
- assertVisible: "What should I call you?"
# The lemon pops out of the sheet 1.6 s after launch; its first line follows.
- extendedWaitUntil:
    visible: "Zest says: Hi! I’m Zest."
    timeout: 15000
- tapOn: "Your name"
- inputText: "Mia"
# Return submits the name; the sheet shortens above the keyboard so Continue stays reachable too.
- pressKey: Enter
# A 1.3 s greeting interlude precedes the first question.
- extendedWaitUntil:
    visible: "What are you here for?"
    timeout: 5000
- assertVisible: "Zest says: Nice to meet you, Mia!"
- tapOn: "Lose weight"
- tapOn: "Continue"
- assertVisible: "A little about you"
- tapOn: "Female"
- tapOn: "Birth year"
- eraseText: 4
- inputText: "1994"
# The keyboard toolbar moves focus; the next field is otherwise under the keyboard.
- tapOn: "Next"
- eraseText: 3
- inputText: "168"
- tapOn: "Next"
- eraseText: 5
- inputText: "70"
- tapOn: "Done"
# Let the keyboard and its toolbar leave before the button underneath is tapped.
- extendedWaitUntil:
    notVisible: "Previous"
    timeout: 5000
- tapOn: "Continue"
- assertVisible: "Where would you like to land?"
- tapOn: "Target weight"
- eraseText: 5
- inputText: "64"
- tapOn: "Done"
# Let the keyboard and its toolbar leave before the button underneath is tapped.
- extendedWaitUntil:
    notVisible: "Previous"
    timeout: 5000
- tapOn: "Continue"
- assertVisible: "How do your weeks move?"
- tapOn: "Lightly active"
- tapOn: "Continue"
- assertVisible: "How quickly?"
- tapOn: "Steady, 0.5 kilograms a week"
- assertVisible: "About 12 weeks.*"
- tapOn: "Continue"
- assertVisible: "How do you eat?"
- tapOn: "Omnivore"
- scrollUntilVisible:
    element: "Continue"
    direction: DOWN
- tapOn: "Continue"
- assertVisible: "Anything to leave out?"
- scrollUntilVisible:
    element: "Continue"
    direction: DOWN
- tapOn: "Continue"
- assertVisible: "When do you usually eat?"
- scrollUntilVisible:
    element: "Continue"
    direction: DOWN
- tapOn: "Continue"
- assertVisible: "What got in the way before?"
- scrollUntilVisible:
    element: "Continue"
    direction: DOWN
- tapOn: "Continue"
- assertVisible: "A small reminder?"
- tapOn: "Not now"
- tapOn: "Continue"
# The account step: e-mail into the profile, the password into the keychain.
- assertVisible: "Keep your diary yours"
- tapOn: "E-mail"
- inputText: "mia@example.com"
- hideKeyboard
- scrollUntilVisible:
    element: "Password"
    direction: DOWN
- tapOn: "Password"
- inputText: "lemonade8"
- tapOn: "Show password"
- assertVisible: "lemonade8"
- tapOn: "Done"
- extendedWaitUntil:
    notVisible: "Previous"
    timeout: 5000
- tapOn: "Continue"
# Four plan items at 1.5 s each, then the reveal.
- assertVisible: "Working it out…"
- extendedWaitUntil:
    visible: "Mia, here’s your guide."
    timeout: 12000
# The final button is hold-to-commit (1.3 s); Maestro's long press holds longer than that.
- longPressOn: "Start logging"
# The greeting is one two-line text; (?s) lets the regex span the line break.
# The greeting is "Good morning/afternoon/evening" or "Still up" after midnight.
- assertVisible: "(?s)(Good|Still up).*Mia\\..*"
- tapOn: "Your profile"
- assertVisible: "32 years · Lose weight"
- assertVisible: "0 day logging streak, 0 of 7 days this week"
- assertVisible: "Just getting started."
# The streak band pushes the account and plan rows below the fold.
- scrollUntilVisible:
    element: "E-mail: mia@example.com. Edit"
    direction: DOWN
- assertVisible: "Password: ••••••••. Edit"
- scrollUntilVisible:
    element: "Goal: Lose weight. Edit"
    direction: DOWN
# Hosted SwiftUI controls may retain their pre-animation AX frame; the close
# target sits at the top trailing corner, as in diary.yaml.
- tapOn:
    point: "90%, 10%"
- assertVisible: "Log a meal"
# The profile and guide survive a relaunch; onboarding does not return.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "(?s)(Good|Still up).*Mia\\..*"
    timeout: 10000
- assertNotVisible: "What should I call you?"
# The first logged meal of a day plays the streak celebration.
- tapOn: "Log a meal"
- tapOn: "Try a sample meal"
- extendedWaitUntil:
    visible: "Take dinner photo"
    timeout: 10000
- tapOn: "Take dinner photo"
# The meal was picked in the camera; no question follows the photo.
- tapOn: "Use meal photo"
- extendedWaitUntil:
    visible: "day streak!"
    timeout: 10000
- assertVisible: "This week: 1 of 7 days logged"
- extendedWaitUntil:
    visible: "Keep it going"
    timeout: 6000
- tapOn: "Keep it going"
- assertVisible: "Edit Pasta & garlic bread, 1120 estimated kilocalories"
