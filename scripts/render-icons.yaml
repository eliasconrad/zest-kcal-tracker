# Draws each mascot through ?icon=<id> for scripts/render-icons.sh. Not part of the test flows.
appId: eu.eliasconrad.zest
---
- openLink: "zest://?icon=pebble"
- tapOn:
    text: "Open"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: "pebble"
- openLink: "zest://?icon=fig"
- tapOn:
    text: "Open"
    optional: true
- waitForAnimationToEnd:
